name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dependencies with known vulnerabilities (pip-audit)
        run: |
          pip install uv==0.11.32 pip-audit
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o requirements.txt
          pip-audit --require-hashes -r requirements.txt

  demo-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ephemeral test licence (SARCADE Pro, module siem)
        run: |
          pip install -q cryptography
          echo "SARCADE_LICENCE_TEST_ROOT=$(python3 demo/make_test_licence.py demo/licence-test)" >> "$GITHUB_ENV"
      - name: Start SARCADE demo stack
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml up -d --build postgres services-stub server
      - name: Wait for API
        run: |
          for i in {1..40}; do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          exit 1
      - name: Verify synchronization and logbook
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify.py"
      - name: Verify map feature synchronisation (ADR-001)
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_map_features.py"
      - name: Verify photos in messages
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_message_photos.py"
      - name: Verify deletions in messages
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_message_deletion.py"
      - name: Verify event operations (PCO settings, devices, end of event)
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_event_operations.py"
      - name: Verify communication groups
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_groups.py"
      - name: Verify the wake-up of the devices
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_wakeup.py"
      - name: Verify sync robustness and the event list
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_sync_robustness.py"
      - name: Verify APRS (callsign groups, filtering, deduplication)
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_aprs.py"
      - name: Verify the weather (stub of Open-Meteo and vigilance)
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_weather.py"
      - name: Verify routes with waypoints
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_routes.py"
      - name: Verify readable location (nearest commune offline, nearest road stand-in)
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_places.py"
      - name: Verify move orders (PCO sends an operator to a point)
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_move_orders.py"
      - name: Verify points of interest (author, rename, delete, logbook)
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_pois.py"
      - name: Verify TV screen (same network, messages per screen, probable zone, opacities)
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_tv.py"
      - name: Verify navigation (routing stand-in, closed roads, route legs, shared itineraries)
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_navigation.py"
      - name: Verify base maps (catalog, custom layers, offline MBTiles packages)
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_basemaps.py"
      - name: Verify updates and security (journal, maintenance, client versions, SIEM)
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_security.py"
      - name: Verify the road graph for navigation on the device and the navigation app setting
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml run --rm --entrypoint sh simulator -c "pip install -q httpx && python /demo/verify_offline_routing.py"
      - name: Verify HTTPS through the reverse proxy (option B, local CA)
        working-directory: demo
        run: |
          docker compose -f docker-compose.demo.yml --profile https up -d --build https
          for i in {1..30}; do
            curl -fsS -H "Host: sarcade.test" http://localhost:8081/sarcade-root.crt -o root.crt && break
            sleep 2
          done
          grep -q "BEGIN CERTIFICATE" root.crt
          # Everything else over plain HTTP is redirected to HTTPS.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: sarcade.test' http://localhost:8081/health)" = "308"
          # The server answers over HTTPS with the certificate of the local CA.
          curl -fsS --cacert root.crt --resolve sarcade.test:8443:127.0.0.1 https://sarcade.test:8443/health
          curl -fsS --cacert root.crt --resolve sarcade.test:8443:127.0.0.1 https://sarcade.test:8443/api/v0.1/clients/config \
            | python3 -c "import json,sys; h=json.load(sys.stdin)['https']; assert h['url']=='https://sarcade.test', h; assert h['root_certificate_url'].endswith('/sarcade-root.crt'), h; print(h)"
      - name: Verify the embedded web client
        run: |
          curl -fsS http://localhost:8000/ -o index.html
          grep -q "SARCADE" index.html
          curl -fsS http://localhost:8000/manifest.json | grep -q '"standalone"'
          curl -fsS http://localhost:8000/health
      - name: Logs on failure
        if: failure()
        working-directory: demo
        run: |
          docker compose -f docker-compose.demo.yml logs
          # Raw logs are not always reachable: server warnings and errors as annotations.
          docker compose -f docker-compose.demo.yml logs server 2>&1 | grep -iE "warning|error|traceback|exception" \
            | tail -40 | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error title=server::${line}"; done || true
      - name: Stop stack
        if: always()
        working-directory: demo
        run: docker compose -f docker-compose.demo.yml --profile https down -v
