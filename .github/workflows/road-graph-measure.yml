name: Road graph measure

# Builds the real road graph of navigation on the device from the
# OpenStreetMap extract of Île-de-France cut to the Yvelines plus about 10 km,
# and reports its size, build time and routing time (decision of 10 Oct 2026).
# Manual, and on the pull requests that change the graph code.
on:
  workflow_dispatch:
    inputs:
      bbox:
        description: "minlon,minlat,maxlon,maxlat (Yvelines + 10 km by default)"
        default: "1.31,48.35,2.37,49.18"
  pull_request:
    paths:
      - "src/sarcade/routing/graph.py"
      - "scripts/measure_road_graph.py"
      - ".github/workflows/road-graph-measure.yml"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BBOX: ${{ github.event.inputs.bbox || '1.31,48.35,2.37,49.18' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: OpenStreetMap extract (Geofabrik Île-de-France, cut to the area)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          curl -fsSL -o idf.osm.pbf https://download.geofabrik.de/europe/france/ile-de-france-latest.osm.pbf
          osmium extract --overwrite -b "$BBOX" -o area.osm.pbf idf.osm.pbf
          ls -l idf.osm.pbf area.osm.pbf
      - name: Build the road graph
        run: |
          start=$(date +%s.%N)
          /usr/bin/time -v python -m sarcade.routing.graph area.osm.pbf graph.srg.gz 2> build-time.txt
          end=$(date +%s.%N)
          echo "BUILD_S=$(echo "$end - $start" | bc)" >> "$GITHUB_ENV"
          grep -E "Maximum resident|Elapsed" build-time.txt
          echo "Build peak memory: $(grep 'Maximum resident' build-time.txt | awk '{print int($6/1024)}') MB" >> "$GITHUB_STEP_SUMMARY"
      - name: Measure size and routing time
        run: python scripts/measure_road_graph.py graph.srg.gz --trips 20 --build-s "$BUILD_S" | tee measure.json
      - name: Key figures as annotations
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("measure.json"))
          print(f"::notice title=Road graph size::package {m['package_bytes']/1e6:.1f} MB (raw {m['raw_bytes']/1e6:.1f} MB), "
                f"{m['vertices']} vertices, {m['edges']} edges, {m['geometry_points']} shape points, build {m['build_s']:.0f} s, "
                f"python parse {m['parse_s_python']} s, peak {m['peak_rss_mb']} MB")
          for mode, r in m["modes"].items():
              print(f"::notice title=Routing {mode}::{r['found']}/{r['trips']} found, median {r['median_ms']} ms, "
                    f"max {r['max_ms']} ms, median settled {r['median_settled']}")
          PY
          echo "::notice title=Build memory::$(grep 'Maximum resident' build-time.txt | awk '{print int($6/1024)}') MB"
      - uses: actions/upload-artifact@v4
        with:
          name: road-graph-yvelines
          path: |
            graph.srg.gz
            graph.srg.gz.json
            measure.json
          retention-days: 14
