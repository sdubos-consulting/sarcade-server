# Register of dismissed vulnerabilities of the SARCADE server (card « GitHub
# de nouveau actif (10 novembre 2026) », choice 4c): OSV-Scanner
# configuration read by the dependency watch on the i9
# (tool/veille-dependances.ps1 -Failles, every day at 6 a.m.) for uv.lock and
# the SBOM of the image served by the NAS. Same format as sarcade-app
# (osv-scanner.toml, docs/sbom.md); security/vex.json stays the register of
# the published image (docs/security-vex-v0.1.md).
#
# One [[IgnoredVulns]] per vulnerability that does not affect SARCADE, with
# all three fields (checked by sarcade-app tool/osv_nightly.py check-config;
# the watch reports an entry without them):
#   id          OSV / GHSA / CVE identifier, as given in the card
#   ignoreUntil re-examination date: after it, the vulnerability is
#               reported again
#   reason      why SARCADE is not affected (« pas concerné, parce que… »),
#               who decided and when
#
# Example:
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2027-05-01
# reason = "Dev tool only, never in the image. Stéphane, 10 Nov 2026"

# Paquets Debian de l'image du NAS sans correctif dans Debian 13 au 11/11/2026 (carte « Veille des
# dépendances », choix 3 validé le 11/11/2026 ; image reconstruite avec --pull à chaque publication).
# Réexamen au 11/02/2027 : la veille les signale de nouveau à cette date.

